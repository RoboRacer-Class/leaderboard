<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESE 6150 Leaderboard</title>
<meta name="description" content="Live lap-time leaderboard for the ESE 6150 Roboracer labs: each team's best clean lap in the grading simulator, with the TA reference.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#07070d">
<link rel="icon" type="image/png" sizes="96x96" href="assets/favicon.png">
<link rel="icon" type="image/svg+xml" href="assets/logo-square.svg">
<meta property="og:type" content="website">
<meta property="og:title" content="ESE 6150 Leaderboard">
<meta property="og:description" content="Live lap-time leaderboard for the ESE 6150 RoboRacer labs.">
<meta property="og:url" content="https://roboracer-class.github.io/leaderboard/">
<meta property="og:image" content="https://roboracer-class.github.io/leaderboard/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="replay.css">
<style>
  :root {
    /* Palette, type and radii follow roboracer.ai (roboracer-site src/index.css):
       ink/paper bases, violet as the one accent, the logo's cyan -> magenta
       gradient only on the logo and the masthead rule. */
    --bg: #fbfbfd;
    --surface: #ffffff;
    --surface-2: #f3f4f8;
    --ink: #0b0c14;
    --ink-2: #3b3f55;
    --ink-3: #62677f;
    --line: #e6e8f0;
    --line-strong: #c9cddc;
    --accent: #7c3aed;
    --accent-tint: #efe7fe;
    --accent-ink: #6d28d9;
    --on-accent: #ffffff;
    --me: #0891a0;             /* the logo's cyan, deepened to read on paper */
    --me-tint: #d8f6f8;
    --me-ink: #0b6470;
    --danger-ink: #a11d3f;
    --chart-dot: #7c3aed;      /* every driver */
    --rank-ink: #5b21b6;       /* position cells: a wash of the violet for the field... */
    --gold: #d9a400;           /* ...solid medals for the top three... */
    --silver: #a9b0ba;
    --bronze: #c4763a;
    --medal-ink: #0b0c14;
    --ref: #c026d3;            /* ...and the logo's magenta for the TA reference row */
    --ref-ink: #ffffff;
    --chart-ref: #62677f;      /* the TA reference rule */
    --chart-me: #0891a0;       /* the alias you highlighted */
    --mast-bg: #07070d;        /* the masthead is ink in both themes, like the site nav */
    --mast-ink: #f5f5fa;
    --mast-ink-2: #a8acc4;
    --mast-line: #242841;
    --mast-accent: #a78bfa;
    --logo-grad: linear-gradient(90deg, #00d1da 0%, #fc00ff 100%);
    --shadow: 0 1px 2px rgb(11 12 20 / .06), 0 4px 12px rgb(11 12 20 / .06);
    --radius: 6px;
    --radius-btn: 4px;
    --display: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
    --body: "Manrope", ui-sans-serif, system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #07070d;
      --surface: #0e0f1a;
      --surface-2: #171a2b;
      --ink: #f5f5fa;
      --ink-2: #a8acc4;
      --ink-3: #8287a3;
      --line: #1f2338;
      --line-strong: #343a5a;
      --accent: #8b5cf6;
      --accent-tint: #241a4a;
      --accent-ink: #c4b5fd;
      --on-accent: #ffffff;
      --me: #00d1da;
      --me-tint: #06323a;
      --me-ink: #7eeaf0;
      --danger-ink: #fda4af;
      --chart-dot: #a78bfa;
      --rank-ink: #c4b5fd;
      --gold: #e0b22a;
      --silver: #aab1ba;
      --bronze: #c98549;
      --medal-ink: #0b0c14;
      --ref: #e879f9;
      --ref-ink: #0b0c14;
      --chart-ref: #8287a3;
      --chart-me: #00d1da;
      --mast-bg: #0e0f1a;
      --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 8px 24px -12px rgb(0 0 0 / .7);
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.45;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    accent-color: var(--accent);
    caret-color: var(--accent);
    scrollbar-color: var(--line-strong) transparent;
  }
  ::selection { background: var(--accent); color: var(--on-accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: .18em; }
  .wrap { width: min(1080px, 100% - 2rem); margin-inline: auto; }

  /* Masthead: ink in both themes, like the site nav. The logo gradient rule
     under it is the only ornament on the page. */
  .masthead {
    background: var(--mast-bg);
    color: var(--mast-ink);
    position: relative;
  }
  .masthead::after {
    content: "";
    display: block;
    height: 3px;
    background: var(--logo-grad);
  }
  .masthead .wrap { padding: 1.5rem 0 0; }
  .masthead :focus-visible { outline-color: var(--mast-accent); }
  .brand { display: inline-flex; flex-wrap: wrap; align-items: center; gap: .5rem .8rem; text-decoration: none; color: var(--mast-ink); }
  .brand .logo { display: block; height: 22px; width: auto; }
  .brand .course {
    font-family: var(--display); font-weight: 500; font-size: .75rem; line-height: 1.2;
    letter-spacing: .14em; text-transform: uppercase; color: var(--mast-ink-2);
    padding-left: .8rem; border-left: 1px solid var(--mast-line);
  }
  h1 {
    font-family: var(--display);
    font-weight: 600;
    font-size: clamp(2.1rem, 4.6vw, 3.2rem);
    line-height: 1;
    letter-spacing: -.03em;
    margin: 1.4rem 0 0;
    text-wrap: balance;
  }
  .lede { margin: .6rem 0 0; max-width: 62ch; color: var(--mast-ink-2); font-size: 1.02rem; }
  .tabs { display: flex; gap: .25rem; margin-top: 1.2rem; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    appearance: none; border: 0; background: transparent; color: var(--mast-ink-2);
    font: inherit; font-weight: 600; font-size: .95rem; padding: .7rem .9rem .8rem;
    border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap;
  }
  .tab:hover { color: var(--mast-ink); }
  .tab[aria-selected="true"] { color: var(--mast-ink); border-bottom-color: var(--mast-accent); }
  .tab .state { font-weight: 500; color: var(--mast-ink-2); opacity: .75; margin-left: .35rem; font-size: .85rem; }
  .switch { display: flex; flex-wrap: wrap; gap: .4rem; margin: 1rem 0 .9rem; }
  .switch button {
    appearance: none; font: inherit; font-weight: 600; font-size: .9rem; cursor: pointer;
    padding: .4rem .85rem; border-radius: var(--radius-btn); border: 1px solid var(--line-strong);
    background: var(--surface); color: var(--ink-2);
  }
  .switch button:hover { color: var(--ink); }
  .switch button[aria-selected="true"] { background: var(--accent-tint); border-color: var(--accent); color: var(--accent-ink); }

  main .wrap { padding: 1.5rem 0 3rem; }

  /* Status strip */
  .status {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 1px;
    background: var(--line); border: 1px solid var(--line); border-radius: var(--radius);
    overflow: hidden; box-shadow: var(--shadow);
  }
  .status > div { background: var(--surface); padding: .85rem 1rem; }
  .status .k { font-family: var(--display); font-weight: 500; font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); margin: 0; }
  .status .v {
    margin: .15rem 0 0; font-family: var(--display); font-weight: 600; font-size: 1.5rem;
    line-height: 1.15; letter-spacing: -.02em; font-variant-numeric: tabular-nums;
  }
  .status .v small { font-family: var(--body); font-weight: 500; font-size: .85rem; letter-spacing: 0; color: var(--ink-2); margin-left: .3rem; }
  .status .closed .v { color: var(--danger-ink); }

  /* Find me */
  .find { margin-top: 1.5rem; display: flex; flex-wrap: wrap; gap: .6rem .8rem; align-items: end; }
  .find label { display: block; font-size: .85rem; color: var(--ink-2); margin-bottom: .3rem; }
  .find .field { flex: 1 1 260px; }
  .find input {
    width: 100%; font: inherit; padding: .6rem .75rem; border-radius: var(--radius-btn);
    border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  }
  .find input::placeholder { color: var(--ink-3); }
  .btn {
    font: inherit; font-weight: 600; padding: .6rem 1rem; border-radius: var(--radius-btn); cursor: pointer;
    border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent);
    transition: background-color 180ms, border-color 180ms;
  }
  .btn:hover { background: var(--accent-ink); border-color: var(--accent-ink); }
  .btn.quiet:hover { background: transparent; border-color: var(--ink-3); color: var(--ink); }
  .btn.quiet { background: transparent; color: var(--ink-2); border-color: var(--line-strong); }
  .find-msg { flex-basis: 100%; margin: 0; font-size: .92rem; color: var(--ink-2); min-height: 1.3em; }
  .find-msg.ok { color: var(--me-ink); }

  /* Board */
  .chart { margin-top: 1.4rem; position: relative; }
  .chart-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: .6rem .6rem .2rem; }
  .chart-scroll { overflow-x: auto; }
  .chart-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: .6rem; }
  .chart-head h2 { margin: 0; }
  .zoom { display: flex; gap: .3rem; }
  .zoom button {
    font: inherit; font-weight: 600; font-size: 1.05rem; line-height: 1; width: 2rem; height: 2rem; cursor: pointer;
    border-radius: var(--radius-btn); border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-2);
  }
  .zoom button:hover:not(:disabled) { color: var(--ink); border-color: var(--accent); }
  .zoom button:disabled { opacity: .4; cursor: default; }
  .chart svg { display: block; font-family: var(--body); }
  .chart .hit { fill: transparent; cursor: pointer; outline: none; }
  .chart .hit:focus-visible + .mark circle, .chart .mark.hot circle { r: 7; }
  .chart .axis text, .chart .lbl { font-size: 11px; fill: var(--ink-3); }
  .chart .lbl.ink { fill: var(--ink); font-weight: 600; font-size: 12px; paint-order: stroke; stroke: var(--surface); stroke-width: 5px; stroke-linejoin: round; }
  .chart .lbl.ink2 { fill: var(--ink-2); font-weight: 600; font-size: 11px; }
  .chart .key { display: flex; flex-wrap: wrap; gap: .4rem 1.1rem; margin: .5rem .2rem 0; font-size: .82rem; color: var(--ink-3); }
  .chart .key i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: .35rem; vertical-align: -1px; }
  .chart .key i.line { width: 16px; height: 0; border-top: 1.5px dashed var(--chart-ref); border-radius: 0; vertical-align: 2px; }
  .chart .tip {
    position: absolute; z-index: 2; pointer-events: none; transform: translate(-50%, calc(-100% - 12px));
    background: var(--ink); color: var(--bg); padding: .4rem .65rem; border-radius: var(--radius-btn); font-size: .82rem; line-height: 1.35; white-space: nowrap;
    box-shadow: var(--shadow);
  }
  .chart .tip strong { display: block; font-family: var(--mono); font-size: 1rem; font-variant-numeric: tabular-nums; }
  .board { margin-top: 1.2rem; }
  .board h2, .grid h2, .chart h2 {
    font-family: var(--display); font-weight: 600; font-size: 1.3rem;
    letter-spacing: -.015em; margin: 0 0 .6rem;
  }
  .board h2 span, .grid h2 span, .chart h2 span { color: var(--ink-3); font-weight: 500; font-size: .95rem; letter-spacing: 0; margin-left: .5rem; }
  .table-wrap {
    overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--surface); box-shadow: var(--shadow);
  }
  table { border-collapse: collapse; width: 100%; min-width: 560px; }
  th, td { padding: .62rem .8rem; text-align: left; border-top: 1px solid var(--line); vertical-align: middle; }
  thead th {
    border-top: 0; font-family: var(--display); font-size: .72rem; text-transform: uppercase; letter-spacing: .14em;
    color: var(--ink-3); font-weight: 500; background: var(--surface-2);
  }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.rank { width: 3.6rem; text-align: center; font-family: var(--display); font-weight: 600; font-size: 1.15rem; }
  td.alias { font-weight: 600; }
  td.time { font-family: var(--mono); font-weight: 600; font-size: 1.15rem; letter-spacing: -.01em; word-spacing: -.35em; }
  td.gap { color: var(--ink-2); }
  td.when { color: var(--ink-3); white-space: nowrap; }
  tbody tr td.rank { background: color-mix(in srgb, var(--chart-dot) 12%, var(--surface)); color: var(--rank-ink); }
  tbody tr:hover td:not(.rank) { background: color-mix(in srgb, var(--accent) 5%, var(--surface)); }
  tbody tr.ref:hover td:not(.rank) { background: color-mix(in srgb, var(--ref) 12%, var(--surface)); }
  tbody tr.me:hover td:not(.rank) { background: var(--me-tint); }
  tr.rank-1 td.rank { background: var(--gold); color: var(--medal-ink); }
  tr.rank-2 td.rank { background: var(--silver); color: var(--medal-ink); }
  tr.rank-3 td.rank { background: var(--bronze); color: var(--medal-ink); }
  tr.ref { color: var(--ink-2); }
  tr.ref td { background: color-mix(in srgb, var(--ref) 9%, var(--surface)); border-top: 1px dashed color-mix(in srgb, var(--ref) 55%, var(--surface)); border-bottom: 1px dashed color-mix(in srgb, var(--ref) 55%, var(--surface)); font-style: italic; }
  tr.ref td.rank { background: var(--ref); color: var(--ref-ink); font-style: normal; font-size: .8rem; letter-spacing: .06em; }
  tr.ref td.time { font-style: normal; }
  tr.me td { background: var(--me-tint); }
  tr.me td:first-child { box-shadow: inset 3px 0 0 var(--me); }
  .pill {
    display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    padding: .12rem .45rem; border-radius: 999px; margin-left: .5rem; vertical-align: middle;
  }
  .pill.you { background: var(--me); color: var(--medal-ink); }
  .pill.locked { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line-strong); }
  @keyframes land { 0% { transform: scale(.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .just-found .pill.you { animation: land .7s cubic-bezier(.16, 1, .3, 1) both; }
  @media (prefers-reduced-motion: reduce) { .just-found .pill.you { animation: none; } }
  .empty { padding: 1.4rem 1rem; color: var(--ink-2); }
  .empty strong { color: var(--ink); }
  @media (max-width: 700px) {
    .col-avg, .col-top, .col-when { display: none; }
    table { min-width: 0; }
    th, td { padding: .5rem .35rem; }
    th:first-child, td:first-child { padding-left: .3rem; }
    th:last-child, td:last-child, th:nth-last-child(2), td:nth-last-child(2) { padding-right: .6rem; }
    thead th { font-size: .66rem; letter-spacing: .08em; }
    td.rank { width: 2.3rem; font-size: 1rem; }
    td.alias { font-size: .95rem; }
    td.time { font-size: .92rem; }
    td.num { font-size: .9rem; }
    td.time.num { font-size: .92rem; }
    .status { grid-template-columns: repeat(2, 1fr); }
    .status .v { font-size: 1.3rem; }
  }

  /* On the grid */
  .grid { margin-top: 1.6rem; }
  .chips { display: flex; flex-wrap: wrap; gap: .45rem; margin: 0; padding: 0; list-style: none; }
  .chips li {
    border: 1px solid var(--line-strong); border-radius: 999px; padding: .3rem .7rem;
    font-size: .92rem; background: var(--surface);
  }
  .chips li.me { border-color: var(--me); background: var(--me-tint); box-shadow: 0 0 0 1px var(--me); }
  .chips li span { color: var(--ink-3); margin-left: .35rem; }
  .grid p { color: var(--ink-2); margin: .3rem 0 .7rem; }

  /* Rules */
  .rules { margin-top: 2.2rem; padding-top: 1.2rem; border-top: 1px solid var(--line); color: var(--ink-2); font-size: .92rem; }
  .rules ul { padding-left: 1.2rem; margin: .4rem 0 0; max-width: 72ch; }
  .rules code { font-family: var(--mono); font-size: .88em; background: var(--surface-2); padding: .05em .35em; border-radius: 4px; }
  .rules li + li { margin-top: .25rem; }
  .rules .fine { margin-top: .9rem; color: var(--ink-3); font-size: .85rem; }
  .terms { margin: 1rem 0 0; color: var(--ink-3); font-size: .85rem; }
  .terms a[aria-current] { color: var(--ink); font-weight: 600; text-decoration: none; }
  .notice { margin: 1rem 0 0; padding: .8rem 1rem; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); color: var(--ink-2); }
  .hidden { display: none !important; }
</style>
</head>

<header class="masthead">
  <div class="wrap">
    <!-- wordmark: roboracer-site public/logos/logo-white-gradient.svg, letters on currentColor -->

.33885 9.38642 3.65954 12.0811 3.65954 15.3985V22.9713H3.658V22.9721ZM20.4727 25.0633C25.7898 25.0633 30.1159 20.7318 30.1159 15.3993C30.1159 10.0668 25.7882 5.72996 20.4727 5.72996C15.1571 5.72996 10.788 10.073 10.788 15.3993C10.788 20.7256 15.131 25.0633 20.4727 25.0633ZM20.4727 21.3945C17.1407 21.3945 14.4452 18.7152 14.4452 15.3993C14.4452 12.0826 17.1399 9.38719 20.4727 9.38719C23.8055 9.38719 26.4579 12.0819 26.4579 15.3993C26.4579 18.7167 23.7786 21.3945 20.4727 21.3945ZM141.584 22.9721V25.0633H137.926V14.9864H137.936C138.152 9.85002 142.392 5.72919 147.57 5.72919C148.777 5.72919 149.933 5.94984 150.998 6.355C150.697 6.60102 150.41 6.86088 150.134 7.13458C149.445 7.82189 148.84 8.59532 148.339 9.43563C148.088 9.40334 147.83 9.38642 147.57 9.38642C144.264 9.38642 141.585 12.0811 141.585 15.3985V22.9713H141.584V22.9721ZM75.8901 22.9721V25.0633H72.2321V14.9864H72.2421C72.4589 9.85002 76.6982 5.72919 81.8769 5.72919C83.0831 5.72919 84.2394 5.94984 85.3042 6.355C85.0036 6.60102 84.7161 6.86088 84.4401 7.13458C83.7512 7.82189 83.147 8.59532 82.6457 9.43563C82.3943 9.40334 82.1367 9.38642 81.8769 9.38642C78.571 9.38642 75.8917 12.0811 75.8917 15.3985V22.9713H75.8901V22.9721ZM102.332 14.9864H102.322C102.105 9.85002 97.8659 5.72919 92.6871 5.72919C87.5084 5.72919 83.0024 10.0722 83.0024 15.3985C83.0024 20.731 87.3454 25.0625 92.6871 25.0625C94.9459 25.0625 97.0271 24.2798 98.6723 22.9713V25.0625H102.33V14.9857H102.332V14.9864ZM92.6887 21.3953C89.3567 21.3953 86.6612 18.716 86.6612 15.4001C86.6612 12.0842 89.3559 9.38796 92.6887 9.38796C96.0215 9.38796 98.6739 12.0826 98.6739 15.4001C98.6739 18.7175 95.9946 21.3953 92.6887 21.3953ZM136.514 15.2286C136.514 10.5696 133.203 6.28965 127.968 6.28965C122.733 6.28965 118.759 10.389 118.759 15.9705C118.759 21.5521 122.858 25.6245 128.03 25.6245C130.337 25.6245 133.233 24.775 135.223 22.5985L132.752 20.1467C131.296 21.5206 129.502 22.0488 128.109 22.0488C125.362 22.0488 123.103 20.1782 122.481 17.442H136.09V17.4267L136.147 17.442C136.375 16.8047 136.515 16.1097 136.515 15.2294L136.513 15.2279L136.514 15.2286ZM127.985 9.85386C130.871 9.85386 132.581 11.932 132.95 14.559H122.436C122.979 11.7659 125.213 9.85386 127.986 9.85386H127.985Z" fill="currentColor"/><defs><linearGradient id="rr-logo-grad" x1="33.8023" y1="22.6248" x2="67.0782" y2="1.49995" gradientUnits="userSpaceOnUse"><stop stop-color="#00D1DA"/><stop offset="1" stop-color="#FC00FF"/></linearGradient></defs></svg>

    <h1>ESE 6150 Leaderboard</h1>
    <p class="lede" id="lede">Best clean lap in the grading simulator. Rebuilt every few minutes from graded submissions.</p>
    <nav class="tabs" id="tabs" aria-label="Labs"></nav>
  </div>
</header>
<main>
  <div class="wrap">
    <p class="notice hidden" id="notice"></p>
    <div class="switch hidden" id="switch" role="tablist" aria-label="Boards of this lab"></div>
    <section class="status" id="status" aria-live="polite"></section>

    <section class="find" aria-labelledby="find-label">
      <div class="field">
        <label id="find-label" for="find-input">Find your row: type the alias from the note in your repository's Feedback pull request</label>
        <input id="find-input" list="alias-list" placeholder="e.g. Turbo Falcon 42" autocomplete="off" spellcheck="false">
        <datalist id="alias-list"></datalist>
      </div>
      <button class="btn" id="find-btn" type="button">Highlight me</button>
      <button class="btn quiet hidden" id="forget-btn" type="button">Forget</button>
      <p class="find-msg" id="find-msg" aria-live="polite"></p>
    </section>

    <section class="chart hidden" id="chart" aria-labelledby="chart-title">
      <div class="chart-head">
        <h2 id="chart-title">Lap times <span id="chart-sub"></span></h2>
        <div class="zoom" role="group" aria-label="Chart zoom">
          <button type="button" id="zoom-out" aria-label="Zoom out: every entry, axis from zero" title="Zoom out">−</button>
          <button type="button" id="zoom-in" aria-label="Zoom in: fewer entries, axis fitted to them" title="Zoom in">+</button>
        </div>
      </div>
      <div class="chart-card">
        <div class="chart-scroll" id="chart-scroll"></div>
        <p class="key" id="chart-key"></p>
      </div>
      <div class="tip hidden" id="chart-tip" role="status" aria-live="polite"></div>
    </section>

    <section class="board" aria-labelledby="board-title">
      <h2 id="board-title">Standings</h2>
      <div class="table-wrap" id="board"></div>
    </section>

    <section class="grid hidden" id="grid" aria-labelledby="grid-title">
      <h2 id="grid-title">On the grid <span id="grid-count"></span></h2>
      <p id="grid-note">Drivers who have submitted but have no qualifying run before the deadline yet.</p>
      <ul class="chips" id="grid-list"></ul>
    </section>

    <footer class="rules" id="rules"></footer>
    <p class="fine terms hidden" id="terms"></p>
  </div>
</main>

<script src="replay.js"></script>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const STORE = "ese6150-leaderboard-alias";
  // ?term=<label> shows an archived term: the rebuild moves a finished term to data/archive/<label>/
  const TERM = /^[a-z0-9-]{1,80}$/.test(params.get("term") || "") ? params.get("term") : "";
  const DATA = TERM ? `data/archive/${TERM}/` : "data/";
  window.RR_DATA_BASE = DATA;                                   // replay.js reads recordings from the same place
  const state = { index: null, docs: {}, slug: params.get("lab"), me: "", justFound: false, pick: {} };
  const labOf = (l) => l.assignment || l.slug;                 // boards of one lab share an assignment
  // tab label: `tab:` in the lab's grader config (published as tab_title), else the lab's full name
  const labName = (l) => l.tab_title || l.lab_title || String(l.title).split(" · ")[0];

  try { state.me = params.get("me") || localStorage.getItem(STORE) || ""; } catch (e) { state.me = params.get("me") || ""; }
  if (params.get("me")) state.justFound = true;

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmtValue = (v, unit) => v.toFixed(2) + (unit ? " " + unit : "");
  const fmtGap = (v, leader, dir) => {
    const d = dir === "lower" ? v - leader : leader - v;
    return d === 0 ? "—" : (d > 0 ? "+" : "−") + Math.abs(d).toFixed(2);
  };
  const fmtWhen = (iso) => {
    const d = new Date(iso);
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + " · " +
      d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  };
  const fmtDeadline = (iso) => new Date(iso).toLocaleString(undefined, { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit", timeZoneName: "short" });
  const countdown = (iso) => {
    let s = Math.max(0, (new Date(iso) - Date.now()) / 1000);
    const d = Math.floor(s / 86400); s -= d * 86400;
    const h = Math.floor(s / 3600); s -= h * 3600;
    const m = Math.floor(s / 60);
    if (d > 0) return `${d}d ${String(h).padStart(2, "0")}h`;
    if (h > 0) return `${h}h ${String(m).padStart(2, "0")}m`;
    return `${m} min`;
  };
  const ago = (iso) => {
    const m = Math.round((Date.now() - new Date(iso)) / 60000);
    if (m < 1) return "just now";
    if (m < 60) return `${m} min ago`;
    const h = Math.round(m / 60);
    return h < 48 ? `${h} h ago` : `${Math.round(h / 24)} d ago`;
  };
  const same = (a, b) => a && b && a.trim().toLowerCase() === b.trim().toLowerCase();
  // Team boards (`mode: team`) are keyed by team number and are not anonymous;
  // older individual boards keep their racing aliases. Absent => anonymous, so
  // a board published before this flag existed still reads correctly.
  const anon = (doc) => doc.anonymous !== false;
  const racer = (doc, n) => (anon(doc) ? (n === 1 ? "driver" : "drivers") : (n === 1 ? "team" : "teams"));

  const EYE = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>';
  const watchButton = (r, summary, label) =>
    `<button type="button" class="watch" data-replay="${esc(r.replay)}" data-name="${esc(r.alias)}" data-summary="${esc(summary)}" data-label="${esc(label)}" aria-label="Watch the run of ${esc(r.alias)}" title="Watch this run">${EYE}<span>Watch</span></button>`;

  async function fetchJSON(path) {
    const r = await fetch(path + "?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(`${path}: HTTP ${r.status}`);
    return r.json();
  }

  async function load(initial) {
    try {
      state.index = await fetchJSON(DATA + "index.json");
    } catch (err) {
      $("notice").textContent = "The board data could not be loaded right now. It rebuilds every few minutes; try again shortly.";
      $("notice").classList.remove("hidden");
      return;
    }
    const labs = state.index.labs || [];
    if (!labs.length) {
      $("notice").textContent = "No lab has a leaderboard yet. The first timed lab appears here once its grader is live.";
      $("notice").classList.remove("hidden");
      return;
    }
    if (!labs.some((l) => l.slug === state.slug)) {
      const open = labs.filter((l) => l.due && new Date(l.due) > Date.now()
        && !(l.available_from && new Date(l.available_from) > Date.now()));
      state.slug = (open.length ? open : labs)[open.length ? 0 : labs.length - 1].slug;
    }
    const lab = labs.find((l) => l.slug === state.slug);
    try {
      state.docs[state.slug] = await fetchJSON(DATA + lab.file);
    } catch (err) {
      $("notice").textContent = "This lab's data could not be loaded right now.";
      $("notice").classList.remove("hidden");
      return;
    }
    $("notice").classList.add("hidden");
    render();
    if (initial && state.me) locate(false);
  }

  function render() {
    const labs = state.index.labs;
    const doc = state.docs[state.slug];
    renderTabs(labs);
    renderSwitch(labs);
    renderStatus(doc);
    renderChart(doc);
    renderBoard(doc);
    renderGrid(doc);
    renderRules(doc);
    renderCopy(doc);
    document.title = `${doc.title} · ESE 6150 Leaderboard`;
    $("forget-btn").classList.toggle("hidden", !state.me);
    if (state.me && !$("find-input").value) $("find-input").value = state.me;
  }

  function renderCopy(doc) {
    $("lede").textContent = anon(doc)
      ? "Every driver's best clean lap in the grading simulator, under a racing alias. Rebuilt every few minutes from graded submissions."
      : "Every team's best clean lap in the grading simulator. Rebuilt every few minutes from graded submissions.";
    $("find-label").textContent = anon(doc)
      ? "Find your row: type the alias from the note in your repository's Feedback pull request"
      : "Find your row: type your team number";
    $("find-input").placeholder = anon(doc) ? "e.g. Turbo Falcon 42" : "e.g. 7";
    $("grid-note").textContent =
      `${anon(doc) ? "Drivers" : "Teams"} who have submitted but have no qualifying run before the deadline yet.`;
  }

  function renderTabs(labs) {
    // one tab per lab; a lab with several boards gets a switch below the tabs
    const current = labs.find((l) => l.slug === state.slug);
    const seen = new Set();
    const groups = labs.filter((l) => !seen.has(labOf(l)) && seen.add(labOf(l)));
    $("tabs").innerHTML = groups.map((l) => {
      const closed = l.due && new Date(l.due) < Date.now();
      // a lab that is listed before it opens is neither open nor closed
      const opens = l.available_from && new Date(l.available_from) > Date.now()
        ? "opens " + new Date(l.available_from).toLocaleDateString(undefined, { month: "short", day: "numeric" }) : "";
      const selected = current && labOf(current) === labOf(l);
      return `<button class="tab" role="tab" data-lab="${esc(labOf(l))}" aria-selected="${selected}" title="${esc(l.lab_title || l.title)}">${esc(labName(l))}<span class="state">${esc(opens || (closed ? "closed" : "open"))}</span></button>`;
    }).join("");
    $("tabs").querySelectorAll(".tab").forEach((b) => b.addEventListener("click", () => {
      const boards = labs.filter((l) => labOf(l) === b.dataset.lab);
      const remembered = boards.find((l) => l.slug === state.pick[b.dataset.lab]);
      switchLab((remembered || boards[0]).slug);
    }));
  }

  function renderSwitch(labs) {
    const current = labs.find((l) => l.slug === state.slug);
    const boards = current ? labs.filter((l) => labOf(l) === labOf(current)) : [];
    $("switch").classList.toggle("hidden", boards.length < 2);
    if (boards.length < 2) { $("switch").innerHTML = ""; return; }
    $("switch").innerHTML = boards.map((l) =>
      `<button type="button" role="tab" data-slug="${esc(l.slug)}" aria-selected="${l.slug === state.slug}">${esc(l.board_title || l.title)}</button>`).join("");
    $("switch").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => switchLab(b.dataset.slug)));
  }

  async function switchLab(slug) {
    state.slug = slug;
    const picked = state.index.labs.find((l) => l.slug === slug);
    if (picked) state.pick[labOf(picked)] = slug;
    const url = new URL(location.href);
    url.searchParams.set("lab", slug);
    history.replaceState(null, "", url);
    if (!state.docs[slug]) {
      const lab = state.index.labs.find((l) => l.slug === slug);
      try { state.docs[slug] = await fetchJSON(DATA + lab.file); } catch (e) { return; }
    }
    render();
    if (state.me) locate(false);
  }

  function renderStatus(doc) {
    const closed = doc.due && new Date(doc.due) < Date.now();
    const notOpen = doc.available_from && new Date(doc.available_from) > Date.now();
    const unit = doc.metric.unit;
    const parts = [];
    if (notOpen) {
      parts.push(`<div><p class="k">Opens</p><p class="v">${esc(countdown(doc.available_from))}<small>${esc(fmtDeadline(doc.available_from))}</small></p></div>`);
    } else if (closed) {
      parts.push(`<div class="closed"><p class="k">Deadline</p><p class="v">Closed<small>${esc(fmtDeadline(doc.due))}</small></p></div>`);
    } else if (doc.due) {
      parts.push(`<div><p class="k">Closes in</p><p class="v">${esc(countdown(doc.due))}<small>${esc(fmtDeadline(doc.due))}</small></p></div>`);
    }
    parts.push(`<div><p class="k">TA reference</p><p class="v">${doc.reference ? esc(fmtValue(doc.reference.metric, unit)) : "—"}</p></div>`);
    parts.push(`<div><p class="k">${anon(doc) ? "Drivers" : "Teams"}</p><p class="v">${doc.rows.length}<small>ranked</small> ${doc.unranked.length}<small>on the grid</small></p></div>`);
    parts.push(`<div><p class="k">Last change</p><p class="v">${esc(ago(doc.generated_at))}<small>checked every 5 min</small></p></div>`);
    $("status").innerHTML = parts.join("");
  }

  const niceStep = (raw) => {
    const pow = Math.pow(10, Math.floor(Math.log10(raw)));
    const f = raw / pow;
    return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * pow;
  };

  // Chart zoom: 1 = every entry on a zero-based axis. Zoomed in, the columns widen
  // (the chart scrolls sideways) and the time axis refits to the entries in view, so
  // a tight podium is not flattened by one slow lap at the far end of the board.
  const ZOOMS = [1, 1.6, 2.5, 4, 6.5];
  const chartView = { zoom: 0, slug: null, doc: null, frame: 0 };

  function renderChart(doc) {
    // one lollipop per ranked driver, left to right by position; height = the lap time
    const sec = $("chart"), tip = $("chart-tip"), scroller = $("chart-scroll");
    const rows = doc.rows || [];
    tip.classList.add("hidden");
    if (chartView.slug !== state.slug) { chartView.slug = state.slug; chartView.zoom = 0; scroller.scrollLeft = 0; }
    chartView.doc = doc;
    $("zoom-out").disabled = chartView.zoom === 0;
    $("zoom-in").disabled = chartView.zoom === ZOOMS.length - 1 || rows.length < 3;
    if (!rows.length) { sec.classList.add("hidden"); scroller.innerHTML = ""; return; }
    sec.classList.remove("hidden");
    const m = doc.metric, unit = m.unit || "";
    const ref = doc.reference ? doc.reference.metric : null;
    const n = rows.length, zoomed = chartView.zoom > 0;
    const padL = 48, padT = 26, padB = 30, plotH = 190;
    const padR = ref != null ? 132 : 18;          // the reference label lives past the last column
    const avail = scroller.clientWidth || 600;
    const col = Math.round(Math.max(28, Math.floor((avail - padL - padR) / n)) * ZOOMS[chartView.zoom]);   // >= 28px: the hit target
    const W = padL + n * col + padR, H = padT + plotH + padB;
    // the time axis: from zero over everyone, or fitted to the columns in view
    let lo = 0, hi = Math.max(...rows.map((r) => r.metric), ref || 0) * 1.08;
    if (zoomed) {
      const first = Math.max(0, Math.floor((scroller.scrollLeft - padL) / col));
      const last = Math.min(n - 1, Math.ceil((scroller.scrollLeft + avail - padL) / col) - 1);
      const seen = rows.slice(first, Math.max(first, last) + 1).map((r) => r.metric);
      const vmin = Math.min(...seen), vmax = Math.max(...seen), pad = Math.max((vmax - vmin) * 0.12, vmax * 0.01, 0.05);
      lo = Math.max(0, vmin - pad); hi = vmax + pad;
    }
    const step = niceStep(Math.max(hi - lo, 1e-6) / 5);
    lo = Math.floor(lo / step + 1e-9) * step;
    const top = Math.ceil(hi / step - 1e-9) * step;
    const y = (v) => padT + plotH - ((v - lo) / (top - lo)) * plotH;
    const x = (i) => padL + i * col + col / 2;
    const y0 = y(lo);
    const digits = step < 0.1 ? 2 : step < 1 ? 1 : 0;
    const colorOf = (r, me) => me ? "var(--chart-me)" : "var(--chart-dot)";
    const parts = [`<defs><clipPath id="plot-clip"><rect x="0" y="${padT - 12}" width="${W}" height="${plotH + 13}"/></clipPath></defs>`];
    // zoomed in, the axis numbers ride along at the left edge of the view (the chart
    // redraws on scroll); they are painted last, over whatever scrolls beneath them
    const ax = zoomed ? Math.min(scroller.scrollLeft, W - avail) : 0;
    const axis = [`<rect x="${ax}" y="0" width="${padL - 2}" height="${H}" fill="var(--surface)"/>`];
    for (let v = lo; v <= top + 1e-9; v += step) {
      const yy = y(v);
      parts.push(`<line x1="${padL}" x2="${W - padR}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/>`);
      axis.push(`<text class="axis" x="${ax + padL - 8}" y="${yy + 4}" text-anchor="end"><tspan class="lbl">${esc(v.toFixed(digits))}</tspan></text>`);
    }
    axis.push(`<text class="lbl" x="${ax + padL - 8}" y="${padT - 12}" text-anchor="end">${esc(unit)}</text>`);
    const refIn = ref != null && ref >= lo && ref <= top;
    if (refIn) {
      parts.push(`<line x1="${padL}" x2="${W - padR}" y1="${y(ref)}" y2="${y(ref)}" stroke="var(--chart-ref)" stroke-width="1.5" stroke-dasharray="6 5"/>`);
      parts.push(`<text class="lbl ink2" x="${W - padR + 8}" y="${y(ref) + 4}" text-anchor="start">TA ref ${esc(fmtValue(ref, unit))}</text>`);
    }
    const every = Math.max(1, Math.ceil(n / Math.max(4, Math.floor((W - padL - padR) / 60))));
    rows.forEach((r, i) => {
      const me = same(r.alias, state.me);
      const c = colorOf(r, me);
      const cx = x(i), cy = y(r.metric);
      let ly = cy - 12;                                        // a label never sits on the reference rule
      if (refIn && Math.abs(ly - y(ref)) < 10) ly = Math.min(ly, y(ref) - 10);
      if (i === 0 || (i + 1) % every === 0 || zoomed) {
        parts.push(`<text class="lbl" x="${cx}" y="${H - 10}" text-anchor="middle">P${r.rank}</text>`);
      }
      parts.push(`<rect class="hit" x="${padL + i * col}" y="${padT - 10}" width="${col}" height="${plotH + padB}" tabindex="0" role="img" data-i="${i}" aria-label="${esc(`P${r.rank} ${r.alias}: ${fmtValue(r.metric, unit)}`)}"/>`);
      // off a zero baseline a stem no longer measures anything: it fades to a guide
      parts.push(`<g class="mark${me ? " me" : ""}" data-i="${i}" pointer-events="none" clip-path="url(#plot-clip)">` +
        `<line x1="${cx}" x2="${cx}" y1="${y0}" y2="${cy}" stroke="${c}" stroke-width="2"${lo > 0 ? ' opacity=".3"' : ""}/>` +
        `<circle cx="${cx}" cy="${cy}" r="${me ? 6 : 5}" fill="${c}" stroke="var(--surface)" stroke-width="2"/>` +
        (me ? `<text class="lbl ink" x="${cx}" y="${ly}" text-anchor="middle">${esc(r.alias)} · ${esc(fmtValue(r.metric, unit))}</text>`
            : (zoomed && col >= 56) || (i === 0 && !(rows[1] && same(rows[1].alias, state.me) && col < 90))
              ? `<text class="lbl ink2" x="${cx}" y="${ly}" text-anchor="${col < 60 ? "start" : "middle"}">${esc(fmtValue(r.metric, unit))}</text>` : "") +
        `</g>`);
    });
    parts.push(`<line x1="${padL}" x2="${W - padR}" y1="${y0}" y2="${y0}" stroke="var(--line-strong)" stroke-width="1"/>`);
    parts.push(...axis);
    scroller.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="group" aria-label="Lap time per ranked ${racer(doc, 1)}">${parts.join("")}</svg>`;
    $("chart-sub").textContent = "";
    $("chart-key").innerHTML = `<span><i style="background:var(--chart-dot)"></i>${racer(doc, 2)}</span>` +
      (ref != null ? `<span><i class="line"></i>TA reference${refIn ? "" : ` (${esc(fmtValue(ref, unit))}, outside this view)`}</span>` : "") +
      `<span><i style="background:var(--chart-me)"></i>you (type your ${anon(doc) ? "alias" : "team number"} above, or click a dot)</span>` +
      (lo > 0 ? `<span>axis starts at ${esc(fmtValue(lo, unit))} and follows the entries in view: scroll sideways</span>` : "");

    const svg = scroller.querySelector("svg");
    const marks = svg.querySelectorAll(".mark");
    const show = (i) => {
      const r = rows[i];
      marks.forEach((g) => g.classList.toggle("hot", g.dataset.i === String(i)));
      const gap = rows[0].metric === r.metric ? "leader" : fmtGap(r.metric, rows[0].metric, m.direction) + " " + unit + " to P1";
      tip.textContent = "";
      const strong = document.createElement("strong"); strong.textContent = fmtValue(r.metric, unit);
      tip.append(strong, document.createTextNode(`P${r.rank} · ${r.alias}`), document.createElement("br"),
                 document.createTextNode(`${gap} · attempt #${r.attempt} of ${r.used}`));
      const dot = svg.querySelector(`.mark[data-i="${i}"] circle`).getBoundingClientRect();
      const box = sec.getBoundingClientRect();
      tip.classList.remove("hidden");
      const half = tip.offsetWidth / 2 + 4;
      tip.style.left = `${Math.min(Math.max(dot.left - box.left + dot.width / 2, half), box.width - half)}px`;
      tip.style.top = `${dot.top - box.top}px`;
    };
    const hide = () => { tip.classList.add("hidden"); marks.forEach((g) => g.classList.remove("hot")); };
    svg.querySelectorAll(".hit").forEach((h) => {
      const i = Number(h.dataset.i);
      h.addEventListener("pointerenter", () => show(i));
      h.addEventListener("focus", () => show(i));
      h.addEventListener("pointerleave", hide);
      h.addEventListener("blur", hide);
      h.addEventListener("click", () => { $("find-input").value = rows[i].alias; locate(true); });
    });
  }

  function zoomChart(direction) {
    const scroller = $("chart-scroll"), svg = scroller.querySelector("svg");
    const next = Math.min(ZOOMS.length - 1, Math.max(0, chartView.zoom + direction));
    if (next === chartView.zoom || !chartView.doc) return;
    // keep the entry at the left edge where it is
    const before = svg ? scroller.scrollLeft / Math.max(1, svg.width.baseVal.value) : 0;
    chartView.zoom = next;
    renderChart(chartView.doc);
    const after = scroller.querySelector("svg");
    scroller.scrollLeft = next === 0 || !after ? 0 : before * after.width.baseVal.value;
    renderChart(chartView.doc);                     // the axis fits what that scroll position shows
  }
  $("zoom-in").addEventListener("click", () => zoomChart(1));
  $("zoom-out").addEventListener("click", () => zoomChart(-1));
  $("chart-scroll").addEventListener("scroll", () => {
    $("chart-tip").classList.add("hidden");
    if (chartView.zoom === 0 || chartView.frame) return;
    chartView.frame = requestAnimationFrame(() => { chartView.frame = 0; if (chartView.doc) renderChart(chartView.doc); });
  }, { passive: true });

  function renderBoard(doc) {
    const m = doc.metric;
    const extras = (m.extras || []).filter((x) => doc.rows.some((r) => r.extras && r.extras[x.key] != null));
    const rows = doc.rows.slice();
    const leader = rows.length ? rows[0].metric : (doc.reference ? doc.reference.metric : null);
    const entries = rows.map((r) => ({ kind: "row", r }));
    if (doc.reference) {
      let i = 0;
      while (i < entries.length && (m.direction === "lower" ? entries[i].r.metric <= doc.reference.metric : entries[i].r.metric >= doc.reference.metric)) i++;
      entries.splice(i, 0, { kind: "ref", r: { alias: "TA reference solution", metric: doc.reference.metric, extras: doc.reference.extras || {}, replay: doc.reference.replay } });
    }
    $("board-title").innerHTML = `${esc(doc.board_title)} <span>${esc(doc.title)}</span>`;
    let emptyNote = "";
    if (!rows.length) {
      const ref = doc.reference ? ` The TA reference is ${esc(fmtValue(doc.reference.metric, m.unit))}.` : "";
      emptyNote = `<p class="empty"><strong>No qualifying run yet.</strong> It takes ${esc(doc.requirement || "the full autograded score")}; the first ${racer(doc, 1)} to post one takes P1.${ref}</p>`;
      $("alias-list").innerHTML = doc.unranked.map((u) => `<option value="${esc(u.alias)}">`).join("");
      // the TA run stays watchable on an empty board: its row is the whole table
      if (!(doc.reference && doc.reference.replay)) { $("board").innerHTML = emptyNote; return; }
    }
    const extraHead = extras.map((x) => `<th class="num col-${esc(x.key.split("_")[0])}">${esc(x.label)}</th>`).join("");
    // rows whose graded run was recorded get an eye button; replay.js plays it back
    const anyReplay = rows.some((r) => r.replay) || !!(doc.reference && doc.reference.replay);
    const watchCell = (r, summary, label) => !anyReplay ? "" : `<td class="watch">${r.replay ? watchButton(r, summary, label) : ""}</td>`;
    const head = `<thead><tr><th>Pos</th><th>${anon(doc) ? "Driver" : "Team"}</th>${anyReplay ? '<th class="watch">Replay</th>' : ""}<th class="num">${esc(m.label)}</th><th class="num">Gap</th>${extraHead}<th class="num col-attempt">Attempt</th><th class="col-when">When</th></tr></thead>`;
    const body = entries.map((e) => {
      const r = e.r;
      const extraCells = extras.map((x) => `<td class="num col-${esc(x.key.split("_")[0])}">${r.extras && r.extras[x.key] != null ? esc(fmtValue(r.extras[x.key], x.unit)) : "—"}</td>`).join("");
      if (e.kind === "ref") {
        return `<tr class="ref"><td class="rank">REF</td><td class="alias">${esc(r.alias)}</td>${watchCell(r, `TA reference · ${fmtValue(r.metric, m.unit)} · ${doc.board_title}`, `TA reference · ${fmtValue(r.metric, m.unit)}`)}<td class="num time">${esc(fmtValue(r.metric, m.unit))}</td><td class="num gap">${leader == null ? "—" : esc(fmtGap(r.metric, leader, m.direction))}</td>${extraCells}<td class="num col-attempt">—</td><td class="when col-when">—</td></tr>`;
      }
      const me = same(r.alias, state.me);
      const cls = [r.rank <= doc.podium ? "podium" : "", r.rank <= 3 ? `rank-${r.rank}` : "", me ? "me" : "", me && state.justFound ? "just-found" : ""].filter(Boolean).join(" ");
      return `<tr class="${cls}"${me ? ' id="me-row"' : ""}><td class="rank">${r.rank}</td><td class="alias">${esc(r.alias)}${me ? '<span class="pill you">you</span>' : ""}${r.locked ? '<span class="pill locked">locked</span>' : ""}</td>${watchCell(r, `P${r.rank} · ${fmtValue(r.metric, m.unit)} · ${doc.board_title}`, `P${r.rank} · ${r.alias} · ${fmtValue(r.metric, m.unit)}`)}<td class="num time">${esc(fmtValue(r.metric, m.unit))}</td><td class="num gap">${esc(fmtGap(r.metric, leader, m.direction))}</td>${extraCells}<td class="num col-attempt">#${r.attempt} of ${r.used}${doc.cap ? "/" + doc.cap : ""}</td><td class="when col-when">${esc(fmtWhen(r.at))}</td></tr>`;
    }).join("");
    $("board").innerHTML = `${emptyNote}<table${anyReplay ? ' class="has-watch"' : ""}>${head}<tbody>${body}</tbody></table>`;
    if (window.RRReplay) RRReplay.attach($("board"), doc);
    state.justFound = false;
    const names = [...doc.rows.map((r) => r.alias), ...doc.unranked.map((u) => u.alias)].sort();
    $("alias-list").innerHTML = names.map((n) => `<option value="${esc(n)}">`).join("");
  }

  function renderGrid(doc) {
    const list = doc.unranked || [];
    $("grid").classList.toggle("hidden", !list.length);
    $("grid-count").textContent = list.length ? `${list.length}` : "";
    $("grid-list").innerHTML = list.map((u) => {
      const me = same(u.alias, state.me);
      return `<li class="${me ? "me" : ""}"${me ? ' id="me-row"' : ""}>${esc(u.alias)}${me ? '<span class="pill you">you</span>' : ""}<span>${u.used}${doc.cap ? "/" + doc.cap : ""} used${u.locked ? " · locked" : ""}</span></li>`;
    }).join("");
  }

  function renderRules(doc) {
    const unit = doc.metric.unit;
    const capRules = doc.cap
      ? `<li>Every push of your <code>submission</code> tag is one attempt. You get ${doc.cap} attempts per lab, graded or not.</li>
        <li>After attempt ${doc.cap} your repository becomes read-only. Need to change anything after that, such as the video link in Submission.md? Ask a TA to unlock it.</li>`
      : `<li>Every push of your <code>submission</code> tag is one attempt, graded or not. There is no limit on this lab: resubmit whenever you improve.</li>`;
    $("rules").innerHTML = `
      <strong>The rules</strong>
      <ul>
        ${capRules}
        <li>Only runs with ${esc(doc.requirement || "the full autograded score")}, graded before the deadline, count here. Your best one is kept.</li>
        <li>The top ${doc.podium} earn extra credit. Rows above the TA reference beat the staff solution${doc.reference ? " (" + esc(fmtValue(doc.reference.metric, unit)) + ")" : ""}.</li>
        ${anon(doc)
          ? `<li>Your alias is in the note on your repository's Feedback pull request. It never changes and nobody else can link it to you.</li>`
          : `<li>Rows are team numbers — the board is not anonymous. Your team's row is also linked from the note on your repository's Feedback pull request.</li>`}
      </ul>
      <p class="fine">Times are simulator time on the grading map, from the same run that produced your grade. A lab can have more than one board (switch above the deadline card), each with its own qualifying rule. Questions go to the course staff.</p>`;
  }

  function locate(announce) {
    const query = $("find-input").value.trim() || state.me;
    if (!query) { $("find-msg").textContent = ""; return; }
    const doc = state.docs[state.slug];
    // On a team board accept what a student actually types: 7, #7, team 7.
    const wanted = anon(doc) ? query : query.replace(/^\s*(?:#|team\s*)?([0-9]+)\s*$/i, "Team $1");
    const hitRow = doc.rows.find((r) => same(r.alias, wanted));
    const hitGrid = doc.unranked.find((u) => same(u.alias, wanted));
    if (!hitRow && !hitGrid) {
      $("find-msg").className = "find-msg";
      $("find-msg").textContent = anon(doc)
        ? `No driver called “${query}” on this lab's board yet. Check the alias in your Feedback PR note; it appears here after your first graded submission.`
        : `No team “${query}” on this lab's board yet. A team appears here after its first graded submission.`;
      return;
    }
    state.me = (hitRow || hitGrid).alias;
    state.justFound = true;
    try { localStorage.setItem(STORE, state.me); } catch (e) { /* private mode */ }
    const url = new URL(location.href);
    url.searchParams.set("lab", state.slug);
    url.searchParams.set("me", state.me);
    history.replaceState(null, "", url);
    render();
    const el = $("me-row");
    if (el) el.scrollIntoView({ block: "center", behavior: announce ? "smooth" : "auto" });
    $("find-msg").className = "find-msg ok";
    $("find-msg").textContent = hitRow
      ? `${state.me}: P${hitRow.rank} of ${doc.rows.length} with ${fmtValue(hitRow.metric, doc.metric.unit)}, ${hitRow.used}${doc.cap ? " of " + doc.cap : ""} submissions used.`
      : `${state.me}: on the grid, ${hitGrid.used}${doc.cap ? " of " + doc.cap : ""} submissions used, no qualifying run before the deadline yet.`;
  }

  $("find-btn").addEventListener("click", () => locate(true));
  $("find-input").addEventListener("keydown", (e) => { if (e.key === "Enter") locate(true); });
  $("forget-btn").addEventListener("click", () => {
    state.me = "";
    $("find-input").value = "";
    $("find-msg").textContent = "";
    try { localStorage.removeItem(STORE); } catch (e) { /* ignore */ }
    const url = new URL(location.href);
    url.searchParams.delete("me");
    history.replaceState(null, "", url);
    render();
  });

  load(true);
  // earlier terms, when the rebuild has archived any
  fetchJSON("data/archive/index.json").then((list) => {
    const terms = (list.terms || []).slice().reverse();
    if (!terms.length) return;
    const link = (t) => `<a href="?term=${encodeURIComponent(t.label)}"${t.label === TERM ? ' aria-current="page"' : ""}>${esc(t.title || t.label)}</a>`;
    $("terms").innerHTML = (TERM ? '<a href="./">Current term</a> · ' : "") + "Earlier terms: " + terms.map(link).join(" · ");
    $("terms").classList.remove("hidden");
  }, () => {});
  let resizeTimer = null;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (state.docs[state.slug]) renderChart(state.docs[state.slug]); }, 150);
  });
  setInterval(() => { if (state.docs[state.slug]) renderStatus(state.docs[state.slug]); }, 30000);
  setInterval(() => load(false), 120000);
})();
</script>
</body>
</html>
